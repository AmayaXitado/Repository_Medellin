<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flujos de Documenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5f7; --card: #ffffff; --soft: #f8fafb; --border: #dfe4e8; --text: #1f2933; --muted: #66727d;
    --primary: #1f4e79; --success: #198754; --warning: #b7791f; --danger: #c53030; --nuevo: #6d4bc4; --campo: #0f766e;
    --c-usuario: #e8f0f8; --c-sistema: #e9f6ef; --c-campo: #e6f4f2; --c-prop: #f1ecfb; --c-decision: #fff8eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101417; --card: #171d21; --soft: #1d252a; --border: #303a40; --text: #edf2f4; --muted: #aab5bc;
      --primary: #4d8ac4; --success: #48bb78; --warning: #ecc94b; --nuevo: #a78bfa; --campo: #2dd4bf;
      --c-usuario: #1a2a3a; --c-sistema: #16291f; --c-campo: #12302c; --c-prop: #241d38; --c-decision: #2e2715;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101417; --card: #171d21; --soft: #1d252a; --border: #303a40; --text: #edf2f4; --muted: #aab5bc;
    --primary: #4d8ac4; --success: #48bb78; --warning: #ecc94b; --nuevo: #a78bfa; --campo: #2dd4bf;
    --c-usuario: #1a2a3a; --c-sistema: #16291f; --c-campo: #12302c; --c-prop: #241d38; --c-decision: #2e2715;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; overflow: hidden; }

  /* Índice */
  aside { width: 300px; flex-shrink: 0; height: 100%; overflow-y: auto; background: var(--card); border-right: 1px solid var(--border); padding: 22px 14px 40px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .marca { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); padding: 0 10px; }
  aside h1 { font-size: 20px; padding: 4px 10px 16px; }
  .buscar { width: calc(100% - 20px); margin: 0 10px 14px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--soft); color: var(--text); font: inherit; font-size: 14px; }
  .modulo { margin-top: 10px; }
  .modulo > p { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
  aside a { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; line-height: 1.3; }
  aside a:hover { background: var(--soft); }
  aside a.activo { background: var(--primary); color: #fff; }
  aside a .n { font-size: 11px; color: var(--muted); min-width: 18px; }
  aside a.activo .n { color: #fff; opacity: .8; }

  /* Escenario */
  main { flex: 1; height: 100%; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .barra { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .progreso { flex: 1; height: 6px; border-radius: 999px; background: var(--soft); border: 1px solid var(--border); overflow: hidden; }
  .progreso div { height: 100%; background: var(--primary); border-radius: 999px; transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .boton { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .boton:hover { background: var(--soft); }
  .boton:disabled { opacity: .4; cursor: default; }
  .contador { font-size: 13px; color: var(--muted); min-width: 64px; text-align: center; }
  .menu-movil { display: none; }

  .pagina { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }
  .pagina.sale { animation: sale .22s ease-in forwards; }
  .pagina.entra-der { animation: entraDer .38s cubic-bezier(.2,.8,.2,1); }
  .pagina.entra-izq { animation: entraIzq .38s cubic-bezier(.2,.8,.2,1); }
  @keyframes sale { to { opacity: 0; transform: translateY(-8px) scale(.99); } }
  @keyframes entraDer { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
  @keyframes entraIzq { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pagina.sale, .pagina.entra-der, .pagina.entra-izq, .nodo { animation: none !important; } }

  .cabecera { margin-bottom: 26px; }
  .cabecera .mod { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--primary); font-weight: 600; }
  .cabecera h2 { font-size: 30px; line-height: 1.15; margin-top: 6px; }
  .cabecera p { color: var(--muted); margin-top: 8px; max-width: 760px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); }

  .leyenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 22px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  .leyenda i { display: inline-block; width: 13px; height: 13px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }

  /* Diagrama */
  .flujo { display: flex; flex-direction: column; align-items: center; }
  .nodo { animation: aparece .45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(min(var(--i, 0), 14) * 35ms); }
  @keyframes aparece { from { opacity: 0; transform: translateY(10px); } }
  .caja { position: relative; width: min(580px, 100%); border-radius: 14px; padding: 13px 18px; text-align: center; font-size: 14.5px; line-height: 1.4; border: 2px solid; }
  .caja b { display: block; font-size: 15.5px; margin-bottom: 2px; }
  .caja small { color: var(--muted); font-size: 13px; display: block; }
  .usuario { background: var(--c-usuario); border-color: var(--primary); }
  .sistema { background: var(--c-sistema); border-color: var(--success); }
  .campo { background: var(--c-campo); border-color: var(--campo); }
  .prop { background: var(--c-prop); border-color: var(--nuevo); border-style: dashed; }
  .alerta { background: var(--c-decision); border-color: var(--danger); }
  .inicio, .fin { width: auto; max-width: 100%; border-radius: 999px; padding: 11px 26px; font-weight: 600; color: #fff; border: 0; }
  .inicio { background: var(--text); color: var(--bg); }
  .fin { background: var(--success); }
  .fin.mal { background: var(--danger); }
  .etq { position: absolute; top: -10px; right: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .etq.nuevo { background: var(--nuevo); }
  .etq.campo { background: var(--campo); }
  .ir { display: inline-block; margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--primary); text-decoration: none; border-bottom: 1px dashed currentColor; cursor: pointer; }
  .ir:hover { opacity: .8; }

  .flecha { width: 2px; height: 24px; background: var(--muted); position: relative; margin: 2px 0 9px; opacity: .7; }
  .flecha::after { content: ''; position: absolute; left: -5px; bottom: -7px; border: 6px solid transparent; border-top: 8px solid var(--muted); }

  .decision { display: flex; align-items: center; gap: 10px; width: fit-content; max-width: min(480px, 100%); padding: 11px 18px 11px 14px; border-radius: 14px; background: var(--c-decision); border: 2px solid var(--warning); }
  .decision::before { content: ''; flex-shrink: 0; width: 13px; height: 13px; transform: rotate(45deg); background: var(--warning); border-radius: 3px; }
  .decision span { font-weight: 700; font-size: 14px; line-height: 1.3; }
  .ramas { display: grid; gap: 16px; width: 100%; margin-top: 4px; }
  .rama { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .rama .caja { width: 100%; }
  .rama > .etq-rama { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--warning); margin-bottom: 6px; text-align: center; }
  .grupo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(780px, 100%); }
  .grupo .caja { width: 100%; text-align: left; }

  .pie { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); }
  .pie a { flex: 1; text-decoration: none; color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--card); }
  .pie a:hover { background: var(--soft); }
  .pie a small { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .pie a.sig { text-align: right; }
  .nota { margin-top: 18px; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 860px) {
    body { display: block; overflow-x: hidden; overflow-y: auto; }
    aside { position: fixed; inset: 0 auto 0 0; z-index: 20; transform: translateX(-100%); transition: transform .25s; width: min(320px, 88vw); }
    aside.abierto { transform: none; box-shadow: 0 0 60px rgba(0,0,0,.35); }
    main { height: auto; overflow: visible; }
    .menu-movil { display: inline-block; }
    .pagina { padding: 22px 16px 60px; }
    .cabecera h2 { font-size: 23px; }
    .grupo { grid-template-columns: 1fr; }
    .ramas { grid-template-columns: 1fr !important; }
    .barra { padding: 10px 16px; gap: 8px; }
    .barra .txt { display: none; }
    .barra .boton { padding: 8px 12px; }
    .contador { min-width: 0; font-size: 12px; }
  }
</style>
</head>
<body>
<aside id="indice">
  <p class="marca">Documenta · Comité de Estudios Médicos</p>
  <h1>Flujos de cada proceso</h1>
  <input class="buscar" id="buscar" type="search" placeholder="Buscar proceso…" aria-label="Buscar proceso">
  <nav id="lista"></nav>
</aside>

<main id="principal">
  <div class="barra">
    <button class="boton menu-movil" id="abrirIndice" aria-label="Abrir índice">☰<span class="txt"> Procesos</span></button>
    <button class="boton" id="anterior" aria-label="Proceso anterior">←<span class="txt"> Anterior</span></button>
    <div class="progreso" aria-hidden="true"><div id="avance"></div></div>
    <span class="contador" id="contador"></span>
    <button class="boton" id="siguiente" aria-label="Proceso siguiente"><span class="txt">Siguiente </span>→</button>
  </div>
  <article class="pagina" id="pagina"></article>
</main>

<script>

const PROCESOS = MODULOS.flatMap(([modulo, lista]) => lista.map((p) => ({ ...p, modulo })));
const indicePorId = Object.fromEntries(PROCESOS.map((p, i) => [p.id, i]));
const $ = (s) => document.querySelector(s);
let actual = -1;
let contadorNodos = 0;

const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const enlace = (id) => (id && indicePorId[id] !== undefined)
    ? `<a class="ir" data-ir="${id}">Ver: ${esc(PROCESOS[indicePorId[id]].titulo)} →</a>` : '';
const flecha = () => '<div class="flecha nodo" style="--i:' + (contadorNodos++) + '"></div>';

function nodo(n) {
    const [tipo, a, b, c] = n;
    const i = contadorNodos++;
    if (tipo === 'inicio') return `<div class="caja inicio nodo" style="--i:${i}">${esc(a)}</div>`;
    if (tipo === 'fin' || tipo === 'finMal') return `<div class="caja fin ${tipo === 'finMal' ? 'mal' : ''} nodo" style="--i:${i}">${esc(a)}${b ? '<br>' + enlace(b).replace('class="ir"', 'class="ir" style="color:#fff"') : ''}</div>`;
    if (tipo === 'grupo') return `<div class="grupo nodo" style="--i:${i}">${a.map((x) => nodo(x)).join('')}</div>`;
    if (tipo === 'decision') {
        const ramas = b.map(([etq, hijos]) => `<div class="rama"><p class="etq-rama">${esc(etq)}</p>${dibujar(hijos)}</div>`).join('');
        return `<div class="decision nodo" style="--i:${i}"><span>${esc(a)}</span></div>
                <div class="ramas" style="grid-template-columns:repeat(auto-fit, minmax(min(100%, 170px), 1fr))">${ramas}</div>`;
    }
    const etiqueta = tipo === 'prop' ? '<span class="etq nuevo">Propuesta</span>' : tipo === 'campo' ? '<span class="etq campo">Por el enlace</span>' : '';
    return `<div class="caja ${tipo} nodo" style="--i:${i}">${etiqueta}<b>${esc(a)}</b>${b ? `<small>${esc(b)}</small>` : ''}${enlace(c)}</div>`;
}

function dibujar(nodos) {
    return nodos.map((n, k) => (k ? flecha() : '') + nodo(n)).join('');
}

function pintar(i, direccion) {
    const p = PROCESOS[i];
    const pagina = $('#pagina');
    contadorNodos = 0;
    const anterior = PROCESOS[i - 1], siguiente = PROCESOS[i + 1];

    pagina.innerHTML = `
        <header class="cabecera">
            <p class="mod">${esc(p.modulo)}${p.propuesta ? ' · propuesta' : ''}</p>
            <h2>${esc(p.titulo)}</h2>
            <p>${esc(p.resumen)}</p>
            <div class="chips">${p.quien.map((q) => `<span class="chip">${esc(q)}</span>`).join('')}</div>
        </header>
        <div class="leyenda">
            <span><i style="background:var(--c-campo);border:2px solid var(--campo)"></i>Persona de campo (enlace / QR)</span>
            <span><i style="background:var(--c-usuario);border:2px solid var(--primary)"></i>Usuario con cuenta</span>
            <span><i style="background:var(--c-sistema);border:2px solid var(--success)"></i>Lo hace el sistema</span>
            <span><i style="background:var(--c-decision);border:2px solid var(--warning)"></i>Decisión / aviso</span>
            <span><i style="background:var(--c-prop);border:2px dashed var(--nuevo)"></i>Propuesta</span>
        </div>
        <section class="flujo">${dibujar(p.pasos)}</section>
        <nav class="pie">
            ${anterior ? `<a data-ir="${anterior.id}"><small>← Anterior</small>${esc(anterior.titulo)}</a>` : '<span style="flex:1"></span>'}
            ${siguiente ? `<a class="sig" data-ir="${siguiente.id}"><small>Siguiente →</small>${esc(siguiente.titulo)}</a>` : '<span style="flex:1"></span>'}
        </nav>
        <p class="nota">Refleja Documenta al 27 de octubre de 2026 (documentacion/docs/context/domain.md). Teclas ← → para moverse.</p>`;

    pagina.className = 'pagina ' + (direccion < 0 ? 'entra-izq' : 'entra-der');
    $('#principal').scrollTo({ top: 0 });
    window.scrollTo({ top: 0 });
}

function ir(i, desdeHistorial = false) {
    if (i < 0 || i >= PROCESOS.length || i === actual) return;
    const direccion = actual === -1 ? 1 : Math.sign(i - actual);
    const pagina = $('#pagina');
    const cambiar = () => {
        actual = i;
        pintar(i, direccion);
        document.querySelectorAll('#lista a').forEach((a) => a.classList.toggle('activo', a.dataset.ir === PROCESOS[i].id));
        document.querySelector('#lista a.activo')?.scrollIntoView({ block: 'nearest' });
        $('#avance').style.width = ((i + 1) / PROCESOS.length * 100) + '%';
        $('#contador').textContent = `${i + 1} de ${PROCESOS.length}`;
        $('#anterior').disabled = i === 0;
        $('#siguiente').disabled = i === PROCESOS.length - 1;
        document.title = PROCESOS[i].titulo + ' · Flujos de Documenta';
        if (!desdeHistorial) history.replaceState(null, '', '#' + PROCESOS[i].id);
        $('#indice').classList.remove('abierto');
    };
    if (actual === -1 || matchMedia('(prefers-reduced-motion: reduce)').matches) return cambiar();
    pagina.className = 'pagina sale';
    setTimeout(cambiar, 200);
}

// Índice
$('#lista').innerHTML = MODULOS.map(([modulo, lista]) => `
    <div class="modulo"><p>${esc(modulo)}</p>
    ${lista.map((p) => `<a href="#${p.id}" data-ir="${p.id}" data-buscar="${esc((p.titulo + ' ' + p.resumen + ' ' + modulo).toLowerCase())}"><span class="n">${indicePorId[p.id] + 1}</span><span>${esc(p.titulo)}</span></a>`).join('')}
    </div>`).join('');

document.addEventListener('click', (e) => {
    const destino = e.target.closest('[data-ir]');
    if (destino) { e.preventDefault(); ir(indicePorId[destino.dataset.ir]); }
});
$('#anterior').addEventListener('click', () => ir(actual - 1));
$('#siguiente').addEventListener('click', () => ir(actual + 1));
$('#abrirIndice').addEventListener('click', () => $('#indice').classList.toggle('abierto'));
document.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return;
    if (e.key === 'ArrowRight') ir(actual + 1);
    if (e.key === 'ArrowLeft') ir(actual - 1);
});
$('#buscar').addEventListener('input', (e) => {
    const t = e.target.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    document.querySelectorAll('#lista a').forEach((a) => {
        a.style.display = !t || a.dataset.buscar.normalize('NFD').replace(/[̀-ͯ]/g, '').includes(t) ? '' : 'none';
    });
    document.querySelectorAll('.modulo').forEach((m) => {
        m.style.display = [...m.querySelectorAll('a')].some((a) => a.style.display !== 'none') ? '' : 'none';
    });
});
addEventListener('hashchange', () => { const i = indicePorId[location.hash.slice(1)]; if (i !== undefined) ir(i, true); });

ir(indicePorId[location.hash.slice(1)] ?? 0);
</script>
</body>
</html>
